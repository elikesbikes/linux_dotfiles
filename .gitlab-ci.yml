stages:
  - deploy

deploy-rocky:
  stage: deploy
  tags: [rocky]
  script:
    - cd ~/devops/github/linux_dotfiles
    - echo "BEFORE:" && git log --oneline -1
    - git fetch gitlab main
    - git reset --hard gitlab/main
    - echo "AFTER:" && git log --oneline -1
    - |
      if ! git diff --quiet HEAD~1 HEAD -- sudoers/ 2>/dev/null; then
        echo "sudoers changed, syncing..."
        sudo /home/ecloaiza/devops/github/linux_dotfiles/scripts/sync-sudoers-ci.sh
      fi
    - echo "dotfiles synced on rocky"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

