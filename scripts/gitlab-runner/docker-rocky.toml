# rocky-docker (runner id 6, docker executor, project runner for mcc). Template for
# gitlab-runner-docker-proton.sh: the token placeholder is replaced in memory with "gitlab-runner token - rocky-docker"
# from Proton and the result goes into the container's tmpfs. No secret in this file.
concurrent = 1
check_interval = 0
connection_max_age = "15m0s"
shutdown_timeout = 0

[session_server]
  session_timeout = 1800

[[runners]]
  name = "rocky-docker"
  url = "https://gitlab.home.elikesbikes.com"
  id = 6
  token = "@TOKEN@"
  executor = "docker"
  # 1 (the default) makes the runner log a "long polling issues" warning at every start
  request_concurrency = 2
  [runners.cache]
    MaxUploadedArchiveSize = 0
    [runners.cache.s3]
      AssumeRoleMaxConcurrency = 0
    [runners.cache.gcs]
    [runners.cache.azure]
  [runners.docker]
    tls_verify = false
    image = "alpine:latest"
    privileged = false
    disable_entrypoint_overwrite = false
    oom_kill_disable = false
    disable_cache = false
    volumes = ["/var/run/docker.sock:/var/run/docker.sock", "/home/ecloaiza/.ssh:/ssh-keys:ro", "/home/ecloaiza/.ssh/proton-pass-agent.sock:/ssh-agent.sock", "/cache"]
    volume_keep = false
    shm_size = 0
    network_mtu = 0
